name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"

  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: utkarsh08122
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish snake animation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch output https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git output

          rm -rf output/*
          cp -R dist/* output/

          cd output

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git diff --cached --quiet || git commit -m "chore: update contribution snake"
          git push origin output